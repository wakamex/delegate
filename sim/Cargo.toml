[package]
name = "delegate-sim"
version = "0.1.0"
edition = "2021"
description = "Simulates delegate's executor-selection policies against generated executor populations"
publish = false

[dependencies]
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = 3
