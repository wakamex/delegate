# An example delegate.toml for a game-simulator port. Its actors are the host roster's, examples/host.toml. See FORMAT.md.
project = "sim"
ledger = "delegate.jsonl"
lease_minutes = 30

[lead]
session = "0123abcd"

[resources]
checkout = ["sim-a", "sim-b", "sim-c", "sim-d"]
live-client = 2
remote-host = 1

[kinds.port]
check = "reviewed"
measure = "lead-score"
classes = ["bounded", "first-reading", "redesign"]
resources = ["checkout", "live-client"]

[kinds.tool]
check = "gated"
measure = "pass-fail"
classes = ["bounded", "cross-cutting"]
resources = ["checkout", "host-memory-gb=16"]

[kinds.investigation]
check = "reviewed"
measure = "lead-score"
investigation = true
